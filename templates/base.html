<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PE Sourcing Agents{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-graph-up-arrow me-2"></i>PE Sourcing Agents
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/deals' in request.path %}active{% endif %}" href="/deals">
            <i class="bi bi-briefcase me-1"></i>Deals
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/investors' in request.path %}active{% endif %}" href="/investors">
            <i class="bi bi-people me-1"></i>Investors
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/settings' in request.path %}active{% endif %}" href="/settings">
            <i class="bi bi-gear me-1"></i>Settings
          </a>
        </li>
      </ul>
      <div class="d-flex gap-2">
        <form method="post" action="/source/deals" class="d-inline">
          <button class="btn btn-outline-primary btn-sm" type="submit">
            <i class="bi bi-arrow-repeat me-1"></i>Source Deals
          </button>
        </form>
        <form method="post" action="/source/investors" class="d-inline">
          <button class="btn btn-outline-success btn-sm" type="submit">
            <i class="bi bi-arrow-repeat me-1"></i>Source Investors
          </button>
        </form>
      </div>
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<footer class="border-top py-3 mt-4">
  <div class="container-fluid text-center text-muted small">
    PE Deal Sourcing &amp; Fundraising &mdash; DACH Region
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
